<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenNotion: an open source workspace that runs in your browser</title>
    <meta
      name="description"
      content="Write, plan and organize with pages, blocks and databases that live on your machine. No account, no server, MIT licensed."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://open-notion-app.vercel.app/" />
    <link rel="canonical" href="https://open-notion-app.vercel.app/" />
    <meta property="og:site_name" content="OpenNotion" />
    <meta property="og:title" content="OpenNotion: write, plan and organize in your browser" />
    <meta
      property="og:description"
      content="An open source workspace with pages, blocks and databases that live on your machine. No account, no server, MIT licensed."
    />
    <meta property="og:image" content="https://open-notion-app.vercel.app/landing/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenNotion: write, plan and organize. Open source, in your browser." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenNotion: write, plan and organize in your browser" />
    <meta
      name="twitter:description"
      content="An open source workspace with pages, blocks and databases that live on your machine. No account, no server, MIT licensed."
    />
    <meta name="twitter:image" content="https://open-notion-app.vercel.app/landing/og.jpg" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-opsz-normal.woff2" crossorigin />
    <link rel="preload" as="image" href="/landing/demo-poster.webp" type="image/webp" />

    <!-- Applies the saved theme before first paint. A blocking classic script from our own origin,
         so the page can use a strict Content-Security-Policy without inline scripts. -->
    <script src="/landing/theme.js"></script>
  </head>
  <body class="landing-body">
    <div id="root"></div>
    <noscript>
      <p class="noscript-note">
        OpenNotion is an open source workspace that runs in your browser.
        <a href="/app/">Open the app</a> or
        <a href="https://github.com/Co-Messi/Open-Notion">view the code on GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
